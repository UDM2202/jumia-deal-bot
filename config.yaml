# Jumia deal bot settings. Edit freely; no passwords or tokens go in this file
# (those live in secrets.yaml on your PC, or in GitHub Secrets).

timezone: Africa/Lagos
base_url: https://www.jumia.com.ng
check_interval_seconds: 120   # how often the PC watcher scans Jumia (don't go below 60)
request_delay_seconds: 2      # pause between page loads, to stay polite
state_file: state.json

# ---------------------------------------------------------------------------
# Things to watch. You get a Telegram message when a product matches ALL the
# rules, and again if its price drops further.
#   include:      words that must be in the product name
#   exclude:      words that must NOT be in the name (filters out accessories)
#   max_price:    alert only at or below this price (naira)
#   min_price:    ignore anything cheaper (filters out cases/fakes)
#   min_discount: alert only at this % off or more
# ---------------------------------------------------------------------------
watches:
  - name: iPhone deal
    query: apple iphone
    include: [iphone]
    exclude: &accessories [case, cover, protector, glass, charger, cable, adapter, pouch, holder, skin, lens, airpods, strap]
    min_price: 150000
    max_price: 900000
    min_discount: 30
    pages: 2

  - name: Samsung deal
    query: samsung galaxy phone
    include: [samsung]
    exclude: *accessories
    min_price: 80000
    max_price: 600000
    min_discount: 30
    pages: 2

  - name: Laptop deal
    query: laptop
    include: [laptop]
    exclude: [bag, sleeve, stand, sticker, keyboard cover, charger, adapter, battery, cooling pad, skin]
    min_price: 150000
    max_price: 900000
    min_discount: 30
    pages: 2

  - name: Kitchen & home wares deal
    query: kitchen ware
    min_discount: 60
    pages: 1

# Scan Jumia's flash-sale page and alert on items with these words in the name.
flash_sales:
  enabled: true
  path: /flash-sales/
  pages: 3
  keywords: [iphone, samsung, galaxy, laptop, hp, dell, lenovo, macbook, ware, pot, blender]
  min_discount: 40

# ---------------------------------------------------------------------------
# Sale reminders for Jumia Black Friday 2026 ("No Manage Am", Oct 30 - Nov 30).
# Confirmed in the press: the daily 7pm "Grab it" challenge, Explosion Friday
# deals from midnight, and the 11.11 freebie hunt (8am-6pm).
# The other flash-sale times are from 2025; check the Jumia app and edit them.
#   days:  repeat weekly on these days   |   dates: only on these exact dates
# ---------------------------------------------------------------------------
reminders:
  enabled: true
  active_from: 2026-10-30
  active_until: 2026-11-30
  minutes_before: [5, 1]
  schedule:
    - label: Jumia "Grab it" challenge (10 premium items, first to check out wins)
      times: ["19:00"]
      url: https://www.jumia.com.ng/
      note: First person to complete checkout gets each item. Be logged in with your address saved.
    - label: Jumia Explosion Friday (deals go live at midnight)
      dates: [2026-11-06, 2026-11-13, 2026-11-20, 2026-11-27]
      times: ["00:00"]
      url: https://www.jumia.com.ng/
    - label: Jumia 11.11 hidden freebies (8am-6pm)
      dates: [2026-11-11]
      times: ["08:00"]
      url: https://www.jumia.com.ng/
    - label: Jumia flash sale (2025 time, unconfirmed)
      days: [mon, tue, wed, thu, fri]
      times: ["10:00", "14:00", "16:00", "18:00"]
      url: https://www.jumia.com.ng/flash-sales/
    - label: Jumia flash sale (2025 time, unconfirmed)
      days: [sat]
      times: ["12:00", "16:00"]
      url: https://www.jumia.com.ng/flash-sales/
    - label: Jumia flash sale (2025 time, unconfirmed)
      days: [sun]
      times: ["14:00"]
      url: https://www.jumia.com.ng/flash-sales/
