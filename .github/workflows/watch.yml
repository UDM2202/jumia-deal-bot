name: Jumia deal watch

on:
  schedule:
    # Every 15 min from 7am to 10:45pm Nigeria time (06:00-21:45 UTC).
    # GitHub may start scheduled runs a few minutes late; the PC watcher is more punctual.
    - cron: "*/15 6-21 * * *"
  workflow_dispatch: {}

concurrency: jumia-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4 PyYAML tzdata
      - name: Restore memory of already-sent alerts
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Check Jumia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py watch --once
      - name: Save memory of sent alerts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
